# Yarn 4 配置，取代 yarn 1 的 .yarnrc（原文件只有一行 `ignore-engines true`，
# 是 7.4.0 上游带进来的，不是本仓的决定；Berry 没这个开关也不需要——对 engines
# 不满足只发警告不失败，而本机 node 26 满足树里全部 717 个 engines.node 声明）。
#
# ⚠ 改这个文件要知道：yarn 自己写这个文件时【会抹掉所有注释】（YAML 序列化器不
# 保留注释）。`yarn config set`、`yarn set version`、版本迁移都会触发重写。
# 普通的 `yarn install` 不会。所以这些注释平时安全，但跑过上述命令后要检查一遍。

plugins:
  - path: .yarn/plugins/install-stamp.cjs
# 每次 install 结束写一致性戳，供 .githooks/pre-push 判断 node_modules 是否过期。
# 为什么非得是插件、而不是 package.json 的 postinstall，见插件文件头（踩过）。

nodeLinker: node-modules
# ── 为什么不用 PnP ────────────────────────────────────────────────────────
# Berry 默认 Plug'n'Play（无 node_modules，依赖直接从 zip 读）。本仓明确不用，
# 理由不是"怕新东西"，是三条会当场断的具体依赖：
#   1. scripts/build.js、tools/verify-*.cjs、scripts/typecheck/* 全部以
#      `node ./xxx` 直接调用。PnP 下必须改成 `yarn node ./xxx`，否则解析不到依赖。
#   2. @ant-design/cli（antd doctor / antd lint，antd 6 迁移的验收工具）按
#      node_modules 布局找包。
#   3. 排障要能直接读 node_modules/antd/es/**。antd 6 迁移里 showSearch 传对象
#      =强制开搜索、Select 的 CSS 变量来源、单选/多选 class 分裂，全是读 antd
#      源码查出来的，不是靠猜。PnP 下这些文件在 zip 里。
# 要评估 PnP，得先解决第 1 条（改全部调用方式）再谈。

enableGlobalCache: true
# cache 放全局（~/.yarn/berry/cache），不落仓库。Berry 4 默认如此，写出来是为了
# 别被"要不要提交 .yarn/cache"反复绊住——答案是不提交，也根本不会生成。

enableScripts: true
# 显式留着：esbuild / core-js×2 / @sentry/cli 这 4 个包确实需要跑构建脚本
# （install 日志里的 YN0007）。关掉它们会静默装出不可用的包。

# ── 下面两条是 yarn 迁移时【自动写入】的 v1 兼容垫片，已【删除】，记在这里免得
#    以后有人看到 yarn 又写回来时以为是必需的 ────────────────────────────
# approvedGitRepositories: ["**"]
#   git: 依赖的允许名单。本仓 yarn.lock 里 git/github 协议依赖 0 条，所以这条
#   垫片不解决任何问题，只是把"任意 git 仓库都可当依赖装进来"这个口子敞开。
# npmMinimalAgeGate: 0
#   Yarn 4 的供应链防护：拒绝安装发布时间过短的版本（npm 包被投毒后，攻击窗口
#   正是发布后的头几小时——chalk/debug 2025-09 那次就是）。垫片把它设成 0 等于
#   关掉。本仓是全公司 OA 的部署源，且依赖升级一向是【显式、逐个、看变更】的，
#   等几天完全不影响节奏，所以恢复默认值。
#
# ── 迁移还【静默删掉】了一条 resolutions，记在这里（package.json 放不下注释）──
# 原有 `"mermaid/**/d3-color": "3.1.0"`，迁移时被无声移除，日志里一个字都没有。
# 原因：Berry 的 resolutions 只支持一层嵌套（`parent/child`），不支持 `**`
# 这种跨层 glob，解析不了就直接丢弃。
# 结论是【不用补】，但依据不是"反正版本没变"：树里 d3-color 只有
# `d3-color@npm:1 - 3` 和 `d3-color@npm:3` 两个 descriptor，两个都封顶在 4 以下，
# 未来也漂不出 3.x。这条 pin 自始至终是个空操作（它跟 .yarnrc 一样是 7.4.0
# 上游带进来的，不是本仓的决定）。
# 真正的教训是：yarn 迁移会【不告而删】自己看不懂的配置，迁完必须逐条对账，
# 不能只看 install 有没有报错。

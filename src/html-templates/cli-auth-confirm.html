<!doctype html>
<html>
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0,user-scalable=no, viewport-fit=cover" />
        <meta name="renderer" content="webkit" />
        <meta name="force-rendering" content="webkit" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
        <title content="登录"></title>
        <style>
            html,
            body {
                margin: 0;
                background-color: #f5f5f9;
                font-family: Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif !important;
            }
            .flex {
                display: flex;
            }
            .flex-1 {
                flex: 1;
            }
            .flex-row {
                flex-direction: row;
            }
            .flex-col {
                flex-direction: column;
            }
            .items-center {
                align-items: center;
            }
            .content-center {
                justify-content: center;
            }
            #app,
            .page {
                height: 100vh;
            }
            .con {
                width: 460px;
                border-radius: 4px;
                border: 1px solid var(--color-border-primary);
                background-color: #ffffff;
            }
            .con .content {
                padding: 36px 36px 8px;
            }
            .con .content:last-child {
                padding-bottom: 36px;
            }
            .con .title {
                font-size: 20px;
                font-weight: bold;
                color: var(--color-text-title);
            }
            .con .description {
                font-size: 13px;
                line-height: 20px;
                color: var(--color-text-secondary);
            }
            .con .url {
                font-size: 13px;
                line-height: 20px;
                color: var(--color-text-title);
                word-break: break-all;
            }
            .m-top12 {
                margin-top: 12px;
            }
            .m-top24 {
                margin-top: 24px;
            }
            .button {
                display: inline-block;
                padding: 0 10px;
                background-color: var(--color-primary);
                border-radius: 4px;
                color: #ffffff;
                height: 34px;
                line-height: 34px;
                font-size: 13px;
                cursor: pointer;
                user-select: none;
            }
            .button:hover {
                background-color: #31a6f3;
            }
            .button.second {
                background-color: #ddd;
                color: #444;
                margin-right: 10px;
            }
            .button.second:hover {
                background-color: #ccc;
            }
            .footer {
                padding: 20px 36px 28px;
                justify-content: end;
            }
        </style>
    </head>

    <body>
        <script src="webpack[single]?src/pages/Mdye/Auth.js"></script>
    </body>
</html>
